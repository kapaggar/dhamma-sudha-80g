<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAN Submission</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#333}
    .wrap{max-width:620px;margin:28px auto;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden}
    .hdr{background:#3c6e47;color:#fff;padding:22px 28px}
    .hdr h1{font-size:19px;font-weight:600}
    .hdr p{font-size:12px;margin-top:5px;opacity:.85}
    .body{padding:26px}
    .course-info{background:#eef4ee;border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:#555}
    .donor-card{border:1px solid #d8d8d8;border-radius:6px;padding:16px;margin-bottom:14px;position:relative}
    .donor-card h3{font-size:13px;color:#666;margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .remove-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:#c00;cursor:pointer;font-size:16px;padding:4px}
    label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:#444}
    .opt{font-weight:400;color:#999;font-size:11px}
    .req{color:#c00}
    input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date]{
      width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;transition:border .15s}
    input:focus{outline:none;border-color:#3c6e47;box-shadow:0 0 0 2px rgba(60,110,71,.12)}
    input[readonly]{background:#f5f5f5;color:#666}
    .field{margin-bottom:12px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pan-wrap{position:relative}
    .pan-badge{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;pointer-events:none}
    .ok{color:#2a7a2a} .err{color:#c00}
    .add-btn{width:100%;padding:10px;border:2px dashed #3c6e47;background:none;color:#3c6e47;
             border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:16px;transition:background .15s}
    .add-btn:hover{background:#eef4ee}
    .consent{background:#fffbea;border:1px solid #d6c84a;border-radius:6px;padding:13px;margin-bottom:18px}
    .consent label{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:400;cursor:pointer}
    .consent input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#3c6e47}
    .submit-btn{width:100%;padding:12px;background:#3c6e47;color:#fff;border:none;
                border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
    .submit-btn:hover{background:#2e5538}
    .submit-btn:disabled{background:#aaa;cursor:default}
    .alert{padding:12px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;display:none}
    .alert-ok{background:#d9ead3;color:#2d6a2d;border:1px solid #b6d7a8}
    .alert-err{background:#f4cccc;color:#9b1c1c;border:1px solid #e06666}
    .done{text-align:center;padding:40px 20px}
    .done h2{color:#2d6a2d;font-size:22px;margin-bottom:10px}
    .done p{color:#555;font-size:14px}
    .privacy{font-size:11px;color:#999;text-align:center;margin-top:16px}
    hr{border:none;border-top:1px solid #eee;margin:16px 0}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1><?= centerName ?></h1>
    <p>80G Donation Certificate - PAN Submission</p>
  </div>
  <div class="body">
    <? if (alreadySubmitted) { ?>
    <div class="done">
      <h2>Already Received</h2>
      <p>We have your PAN details on file for this course.<br>Your 80G certificate will be issued shortly.</p>
    </div>
    <? } else { ?>
    <div id="alertBox" class="alert"></div>
    <div class="course-info">
      <strong>Course:</strong> <?= courseId ?>
      <? if (courseStart) { ?>&nbsp;&middot;&nbsp;<strong>Dates:</strong> <?= courseStart ?> to <?= courseEnd ?><? } ?>
    </div>
    <div class="field">
      <label>Email <span class="req">*</span></label>
      <input type="email" id="f_email" value="<?= email ?>" readonly>
    </div>
    <div class="field">
      <label>Mobile <span class="req">*</span></label>
      <input type="tel" id="f_mobile" placeholder="10-digit mobile number" maxlength="15">
    </div>
    <hr>
    <div id="donorCards"></div>
    <button type="button" class="add-btn" onclick="addDonor()">+ Add Another Donor / Family Member</button>
    <div class="consent">
      <label>
        <input type="checkbox" id="f_consent">
        I confirm that the PAN details provided are correct and may be used for issuing the 80G donation certificate.
      </label>
    </div>
    <button type="button" class="submit-btn" id="submitBtn" onclick="handleSubmit()">Submit PAN Details</button>
    <p class="privacy">Secure personalized link - PAN not stored in plaintext logs</p>
    <? } ?>
  </div>
</div>
<script>
  var COURSE_ID = <?= JSON.stringify(courseId) ?>;
  var EMAIL     = <?= JSON.stringify(email) ?>;
  var TOKEN     = <?= JSON.stringify(token) ?>;
  var PREFILL   = <?= JSON.stringify(prefillName) ?>;
  var dcCount   = 0;

  function addDonor(name) {
    dcCount++;
    var id = dcCount;
    var div = document.createElement('div');
    div.className = 'donor-card';
    div.id = 'dc' + id;
    div.innerHTML = '<h3>Donor ' + id +
      (id > 1 ? ' <button class="remove-btn" onclick="removeDonor('+id+')" title="Remove">X</button>' : '') + '</h3>' +
      '<div class="field"><label>Full Name <span class="req">*</span></label>' +
      '<input type="text" id="d_name_'+id+'" placeholder="As per records" value="'+(name||'')+'"></div>' +
      '<div class="field"><label>Name as per PAN <span class="req">*</span></label>' +
      '<input type="text" id="d_panname_'+id+'" placeholder="Exactly as printed on PAN card"></div>' +
      '<div class="field pan-wrap"><label>PAN Number <span class="req">*</span></label>' +
      '<input type="text" id="d_pan_'+id+'" placeholder="ABCDE1234F" maxlength="12" ' +
      'oninput="onPAN(this,'+id+')" style="text-transform:uppercase;letter-spacing:1px">' +
      '<span class="pan-badge" id="d_panb_'+id+'"></span></div>' +
      '<div class="row2">' +
      '<div class="field"><label>Amount <span class="opt">(optional)</span></label>' +
      '<input type="number" id="d_amt_'+id+'" placeholder="Rs." min="0"></div>' +
      '<div class="field"><label>Donation Date <span class="opt">(optional)</span></label>' +
      '<input type="date" id="d_date_'+id+'"></div></div>' +
      '<div class="field"><label>Payment Reference <span class="opt">(optional)</span></label>' +
      '<input type="text" id="d_ref_'+id+'" placeholder="UPI / NEFT / cheque ref"></div>' +
      '<div class="field"><label>Notes <span class="opt">(optional)</span></label>' +
      '<input type="text" id="d_notes_'+id+'" placeholder="Relationship, remarks..."></div>';
    document.getElementById('donorCards').appendChild(div);
  }

  function removeDonor(id) {
    var el = document.getElementById('dc'+id);
    if (el) el.remove();
  }

  function onPAN(input, id) {
    var v = input.value.toUpperCase().replace(/\s+/g,'');
    input.value = v;
    var badge = document.getElementById('d_panb_'+id);
    if (!v) { badge.textContent=''; input.style.borderColor=''; return; }
    if (/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v)) {
      badge.textContent='OK'; badge.className='pan-badge ok'; input.style.borderColor='#2a7a2a';
    } else {
      badge.textContent='X'; badge.className='pan-badge err'; input.style.borderColor='#c00';
    }
  }

  function v(id) { var el=document.getElementById(id); return el ? el.value.trim() : ''; }

  function collectDonors() {
    var cards = document.querySelectorAll('.donor-card'), donors = [];
    for (var i=0; i<cards.length; i++) {
      var id = cards[i].id.replace('dc','');
      donors.push({
        name:              v('d_name_'+id),
        name_as_per_pan:   v('d_panname_'+id),
        pan:               v('d_pan_'+id).toUpperCase().replace(/\s+/g,''),
        donation_amount:   v('d_amt_'+id),
        donation_date:     v('d_date_'+id),
        payment_reference: v('d_ref_'+id),
        notes:             v('d_notes_'+id)
      });
    }
    return donors;
  }

  function showAlert(type, msg) {
    var el = document.getElementById('alertBox');
    el.className = 'alert alert-'+(type==='error'?'err':'ok');
    el.textContent = msg;
    el.style.display = 'block';
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function handleSubmit() {
    var mobile  = v('f_mobile');
    var consent = document.getElementById('f_consent').checked;
    var btn     = document.getElementById('submitBtn');

    if (!mobile)  { showAlert('error','Please enter your mobile number.'); return; }
    if (!consent) { showAlert('error','Please check the consent box to proceed.'); return; }

    var donors = collectDonors();
    if (!donors.length) { showAlert('error','No donor information found.'); return; }

    for (var i=0; i<donors.length; i++) {
      var d = donors[i];
      if (!d.name)            { showAlert('error','Full name required for donor '+(i+1)); return; }
      if (!d.name_as_per_pan) { showAlert('error','Name as per PAN required for: '+d.name); return; }
      if (!d.pan)             { showAlert('error','PAN required for: '+d.name); return; }
      if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(d.pan)) {
        showAlert('error','Invalid PAN for '+d.name+': '+d.pan+' (expected format: ABCDE1234F)'); return;
      }
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          showAlert('ok','PAN details submitted. Your 80G certificate will be issued shortly. Thank you.');
          btn.textContent = 'Submitted';
          document.querySelectorAll('.donor-card input').forEach(function(el){el.disabled=true});
          document.getElementById('f_mobile').readOnly = true;
          document.getElementById('f_consent').disabled = true;
          document.querySelector('.add-btn').style.display = 'none';
        } else {
          showAlert('error', res.error || 'Submission failed. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Submit PAN Details';
        }
      })
      .withFailureHandler(function(err) {
        showAlert('error','Error: ' + (err.message || 'Unknown error. Please try again.'));
        btn.disabled = false;
        btn.textContent = 'Submit PAN Details';
      })
      .submitForm({ token: TOKEN, course_id: COURSE_ID, email: EMAIL,
                    mobile: mobile, consent: true, donors: donors });
  }

  addDonor(PREFILL);
</script>
</body>
</html>
