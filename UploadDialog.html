<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <?!= HtmlService.createHtmlOutputFromFile('UiStyles').getContent() ?>
</head>
<body class="dialog">
  <main>
    <div class="eyebrow">80G admin · Import donations</div>
    <h1>Import a downloaded report.</h1>
    <p class="description">Download the donation report from the Dana portal, then choose the file from your computer.</p>
    <form id="uploadForm" novalidate>
      <div class="file-area">
        <label for="file">Donation report</label>
        <input type="file" id="file" accept=".xls,.xlsx" aria-describedby="fileHelp fileSummary" required>
        <p class="hint" id="fileHelp">XLS or XLSX · Up to 10 MB</p>
        <p class="file-summary" id="fileSummary" aria-live="polite"></p>
      </div>
      <p class="hint">Existing receipts are skipped. Importing may take 30–60 seconds.</p>
      <div class="actions">
        <button type="button" class="secondary" id="cancelBtn" onclick="google.script.host.close()">Cancel</button>
        <button type="submit" class="primary" id="goBtn"><span id="spinner" class="spinner" aria-hidden="true" hidden></span><span id="goLabel">Import report</span></button>
      </div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite" tabindex="-1" hidden></div>
  </main>
<script>
  var MAX_BYTES = 10 * 1024 * 1024;
  var busy = false;
  var complete = false;
  var form = document.getElementById('uploadForm');
  var input = document.getElementById('file');

  function setBusy(value) {
    busy = value;
    form.setAttribute('aria-busy', String(value));
    ['goBtn', 'cancelBtn', 'file'].forEach(function(id) { document.getElementById(id).disabled = value; });
    document.getElementById('spinner').hidden = !value;
    document.getElementById('goLabel').textContent = value ? 'Importing…' : complete ? 'Done' : 'Import report';
  }
  function fail(message) {
    setBusy(false);
    showStatus('err', message || 'Import failed. Please try again.');
    document.getElementById('status').focus();
  }
  function runImport(event) {
    if (event) event.preventDefault();
    if (busy) return;
    if (complete) { google.script.host.close(); return; }
    var file = input.files && input.files[0];
    if (!file || !/\.xlsx?$/i.test(file.name)) {
      showStatus('err', 'Choose an XLS or XLSX report.'); input.focus(); return;
    }
    if (!file.size || file.size > MAX_BYTES) {
      showStatus('err', 'Choose a non-empty report no larger than 10 MB.'); input.focus(); return;
    }
    setBusy(true);
    showStatus('loading', 'Reading your file. Keep this window open until the import finishes.');
    var reader = new FileReader();
    reader.onload = function() {
      showStatus('loading', 'Importing your report. Existing receipts will be skipped.');
      try {
        var base64 = reader.result.split(',')[1];
        google.script.run
          .withSuccessHandler(function(res) {
            if (!res || !res.success || !res.result) { fail(res && res.error); return; }
            complete = true;
            setBusy(false);
            input.value = '';
            input.disabled = true;
            document.getElementById('cancelBtn').hidden = true;
            var r = res.result;
            showStatus('ok', 'Import complete\n' + r.added + ' added · ' + r.skipped + ' already in your sheet · ' + r.total + ' reviewed\n' +
              r.needPan + ' need PAN · ' + r.havePan + ' have PAN · ' + r.autoFilled + ' auto-filled\n' +
              r.noEmail + ' without email');
            document.getElementById('status').focus();
          })
          .withFailureHandler(function(err) { fail(err && err.message); })
          .runUploadImport(base64, file.name);
      } catch (_) { fail('Couldn’t connect. Close this window and reopen Import from the 80G Admin menu.'); }
    };
    reader.onerror = reader.onabort = function() { fail('Couldn’t read the file. Please select it again.'); };
    try { reader.readAsDataURL(file); } catch (_) { fail('Couldn’t read the file. Please select it again.'); }
  }
  function showStatus(type, message) {
    var status = document.getElementById('status');
    status.className = 'status ' + type;
    status.setAttribute('role', type === 'err' ? 'alert' : 'status');
    status.textContent = message;
    status.hidden = false;
  }
  input.addEventListener('change', function() {
    var file = input.files && input.files[0];
    document.getElementById('fileSummary').textContent = file ? file.name + ' · ' +
      (file.size < 1048576 ? Math.ceil(file.size / 1024) + ' KB' : (file.size / 1048576).toFixed(1) + ' MB') : '';
    document.getElementById('status').hidden = true;
  });
  form.addEventListener('submit', runImport);
</script>
</body>
</html>
