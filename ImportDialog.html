<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <?!= HtmlService.createHtmlOutputFromFile('UiStyles').getContent() ?>
</head>
<body class="dialog">
  <main>
    <div class="eyebrow">80G admin · Import donations</div>
    <h1>Bring your records up to date.</h1>
    <p class="description">Choose a date range to import from the Dana portal. Receipts already in your sheet will be skipped.</p>
    <div class="info">Last import ended <strong><?= lastImport ?></strong></div>
    <form id="importForm" novalidate>
      <div class="date-row">
        <div><label for="start">Start date</label><input type="date" id="start" value="<?= defaultStart ?>" required></div>
        <div><label for="end">End date</label><input type="date" id="end" value="<?= defaultEnd ?>" required></div>
      </div>
      <p class="hint">Both dates are included. Importing may take 30–60 seconds.</p>
      <div class="actions">
        <button type="button" class="secondary" id="cancelBtn" onclick="google.script.host.close()">Cancel</button>
        <button type="submit" class="primary" id="goBtn"><span id="spinner" class="spinner" aria-hidden="true" hidden></span><span id="goLabel">Import donations</span></button>
      </div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite" tabindex="-1" hidden></div>
  </main>
<script>
  var busy = false;
  var complete = false;
  var form = document.getElementById('importForm');
  var startInput = document.getElementById('start');
  var endInput = document.getElementById('end');

  function setBusy(value) {
    busy = value;
    form.setAttribute('aria-busy', String(value));
    ['goBtn', 'cancelBtn', 'start', 'end'].forEach(function(id) { document.getElementById(id).disabled = value; });
    document.getElementById('spinner').hidden = !value;
    document.getElementById('goLabel').textContent = value ? 'Importing…' : complete ? 'Done' : 'Import donations';
  }
  function fail(message) {
    setBusy(false);
    showStatus('err', message || 'Import failed. Please try again.');
    document.getElementById('status').focus();
  }
  function runImport(event) {
    if (event) event.preventDefault();
    if (busy) return;
    if (complete) { google.script.host.close(); return; }
    var start = startInput.value;
    var end = endInput.value;
    if (!start || !end || !startInput.validity.valid || !endInput.validity.valid || start > end) {
      showStatus('err', 'Choose both dates, with the start date on or before the end date.');
      (!start ? startInput : endInput).focus(); return;
    }
    setBusy(true);
    showStatus('loading', 'Import in progress. Keep this window open until it finishes.');
    try {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success || !res.result) { fail(res && res.error); return; }
          complete = true;
          setBusy(false);
          startInput.disabled = true;
          endInput.disabled = true;
          document.getElementById('cancelBtn').hidden = true;
          var r = res.result;
          showStatus('ok', 'Import complete · ' + res.startDate + ' to ' + res.endDate + '\n' +
            r.added + ' added · ' + r.skipped + ' already in your sheet · ' + r.total + ' reviewed\n' +
            r.needPan + ' need PAN · ' + r.havePan + ' have PAN · ' + r.autoFilled + ' auto-filled\n' +
            r.noEmail + ' without email');
          document.getElementById('status').focus();
        })
        .withFailureHandler(function(err) { fail(err && err.message); })
        .runImportFromDialog(start, end);
    } catch (_) { fail('Couldn’t connect. Close this window and reopen Import from the 80G Admin menu.'); }
  }
  function showStatus(type, message) {
    var status = document.getElementById('status');
    status.className = 'status ' + type;
    status.setAttribute('role', type === 'err' ? 'alert' : 'status');
    status.textContent = message;
    status.hidden = false;
  }
  form.addEventListener('submit', runImport);
</script>
</body>
</html>
